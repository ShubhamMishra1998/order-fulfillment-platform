spring.application.name=api-gateway
server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/levelup-realm

spring.cloud.gateway.server.webmvc.routes[0].id=order-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8000
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=CircuitBreaker=orderService

spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8001
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/inventory/**


management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Expose selected Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers

# Show component health details
management.endpoint.health.show-details=when-authorized

# Circuit breaker configuration
resilience4j.circuitbreaker.instances.orderService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.orderService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.orderService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.orderService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.orderService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.orderService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.orderService.permittedNumberOfCallsInHalfOpenState=2