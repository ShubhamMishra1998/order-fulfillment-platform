services:
  postgres:
    image: postgres:17
    container_name: order-service-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpassword
    ports:
      - "5432:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data

volumes:
  order-postgres-data: