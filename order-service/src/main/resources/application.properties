spring.application.name=order-service
server.port=8000

spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=orderuser
spring.datasource.password=orderpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/levelup-realm

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Expose selected Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Show component health details
management.endpoint.health.show-details=when-authorized


management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true